version: '3.8'

services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-invoice-app
    ports:
      - "8000:8000"
    volumes:
      # Mount uploads directory to persist files
      - ./uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      # ==========================================
      # API Configuration: Choose ONE option below
      # ==========================================
      # Option 1: PRODUCTION API (comment out Option 2 if using this)
      - API_BASE_URL=https://readapi.accountingonweb.com
      # Option 2: DEVELOPMENT API (comment out Option 1 if using this)
      # - API_BASE_URL=https://localhost:7047
      # ==========================================
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
